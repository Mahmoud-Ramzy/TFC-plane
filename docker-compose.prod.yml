# TFC-Plane production stack (image-based).
# Pulls the six custom TFC images from GHCR and uses upstream images for the
# supporting services (PostgreSQL, Valkey/Redis, RabbitMQ, MinIO).
#
# Run from the repo root:
#   cp .env.production.example .env   # then edit .env
#   docker compose -f docker-compose.prod.yml up -d

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-mq-env: &mq-env # RabbitMQ Settings
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-secret-key}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-secret-key}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  web:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-web:${APP_RELEASE:-latest}
    restart: always
    depends_on:
      - api
      - worker

  space:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-space:${APP_RELEASE:-latest}
    restart: always
    depends_on:
      - api
      - worker
      - web

  admin:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-admin:${APP_RELEASE:-latest}
    restart: always
    depends_on:
      - api
      - web

  live:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-live:${APP_RELEASE:-latest}
    environment:
      <<: [*live-env, *redis-env]
    restart: always
    depends_on:
      - api
      - web

  api:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-api:${APP_RELEASE:-latest}
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_api:/code/plane/logs
    restart: always
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-api:${APP_RELEASE:-latest}
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_worker:/code/plane/logs
    restart: always
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-api:${APP_RELEASE:-latest}
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_beat-worker:/code/plane/logs
    restart: always
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-api:${APP_RELEASE:-latest}
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_migrator:/code/plane/logs
    restart: "on-failure"
    depends_on:
      - plane-db
      - plane-redis

  # ---------- upstream infrastructure ----------

  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    image: ${TFC_IMAGE_PREFIX:-ghcr.io/mahmoud-ramzy}/tfc-plane-proxy:${APP_RELEASE:-latest}
    environment:
      <<: *proxy-env
    restart: always
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
