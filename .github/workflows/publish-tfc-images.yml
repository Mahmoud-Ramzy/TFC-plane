name: Publish TFC Images to GHCR

on:
  push:
    branches:
      - tfc-branding

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The web/admin/space/live images build from the repo root because their
          # Dockerfiles use `turbo prune` (they need the whole workspace + lockfile).
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - name: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - name: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          # api/proxy build from their own directory.
          - name: api
            context: ./apps/api
            dockerfile: Dockerfile.api
          - name: proxy
            context: ./apps/proxy
            dockerfile: Dockerfile.ce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfc-plane-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/tfc-plane-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=tfc-plane-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=tfc-plane-${{ matrix.name }}
